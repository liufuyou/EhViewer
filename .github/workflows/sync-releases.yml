name: sync releases

# 定时轮询上游 Release，有变化就开 PR，不直接推 main —— 版本号是机器写的，
# 让人过一眼再合并，比让机器人直接改主干安全。
# schedule 高峰期会延迟甚至丢掉一次触发，GitHub 没有 SLA，所以这里是「准实时」；
# 真要秒级得上 webhook + 公网接收端，属于新增基础设施，暂不做。

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检查、不创建 PR"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r scripts/requirements.txt

      - name: 同步上游 release
        id: sync
        env:
          # 用内置 token，额度够用，也不必另外保管密钥
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/sync_releases.py --apply --report sync-report.md
          code=$?
          set -e
          echo "exit=${code}" >> "$GITHUB_OUTPUT"
          # 2 = 发现已确认的安全公告，不算失败
          if [ "$code" -gt 2 ]; then
            echo "::error::sync_releases.py 异常退出（$code）"
            exit "$code"
          fi

      - name: 重新生成 README
        run: python scripts/render.py

      - name: 判断是否有改动
        id: diff
        run: |
          if git diff --quiet -- data/versions.yaml README.md README.en.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有新版本，结束。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/versions.yaml README.md README.en.md
          fi

      - name: 有安全公告时给出警告
        if: steps.sync.outputs.exit == '2'
        run: |
          echo "::warning::发现已确认的上游安全公告，请优先审查本次改动，并在合并前核实影响范围。"

      - name: 提交分支并开 PR
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR="sync/releases-$(date -u +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add data/versions.yaml README.md README.en.md

          TITLE="chore: 同步上游最新版本"
          if grep -q "security_level: confirmed" data/versions.yaml; then
            TITLE="⚠️ chore: 同步上游版本（含安全公告）"
          fi

          git commit -m "$TITLE"
          git push origin "$BR"
          gh pr create \
            --title "$TITLE" \
            --body-file sync-report.md \
            --base main \
            --head "$BR"

      - name: 没有改动时保留报告
        if: steps.diff.outputs.changed == 'false'
        run: cat sync-report.md
