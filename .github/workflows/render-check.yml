name: render-check

# README 和单页都由脚本生成，手改会被这里拦下

on:
  push:
    paths:
      - "README.md"
      - "README.en.md"
      - "docs/index.html"
      - "data/versions.yaml"
      - "scripts/render.py"
  pull_request:
    paths:
      - "README.md"
      - "README.en.md"
      - "docs/index.html"
      - "data/versions.yaml"
      - "scripts/render.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -q -r scripts/requirements.txt

      - name: 校验生成物与清单一致
        run: python scripts/render.py --check

      # --check 只比对字符串，页面里的 JS 写错了它照样通过，所以单独跑一次语法检查
      - name: 校验页面脚本
        run: |
          python - <<'PY'
          import pathlib
          import re
          html = pathlib.Path("docs/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", html, re.S)
          pathlib.Path("page.js").write_text(blocks[-1], encoding="utf-8")
          print(f"提取 {len(blocks)} 段脚本，最后一段 {len(blocks[-1])} 字符")
          PY
          node --check page.js
