name: render-check

# README 由脚本生成，手改会被这里拦下

on:
  push:
    paths:
      - "README.md"
      - "README.en.md"
      - "data/versions.yaml"
      - "scripts/render.py"
  pull_request:
    paths:
      - "README.md"
      - "README.en.md"
      - "data/versions.yaml"
      - "scripts/render.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -q -r scripts/requirements.txt

      - name: 校验 README 与清单一致
        run: python scripts/render.py --check
