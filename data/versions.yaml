    zh: 推荐版本
    en: Recommended

  - id: android_alt
    zh: 其他 Android 分支
    en: Other Android builds
    collapsed: true

  - id: cross_platform
    zh: 全平台/桌面端
    en: All platforms / Desktop

  - id: ios
    zh: iOS
    en: iOS

  - id: harmonyos
    zh: 鸿蒙
    en: HarmonyOS

  - id: dormant
    zh: 已停更
    en: Dormant

  - id: archived
    zh: 已下架 / 已归档
    en: Taken down / archived
    zh_intro: 不要再用这些。部分版本还会导致数据不兼容，迁移前务必备份。
    en_intro: Do not use these. Some may cause data incompatibility — back up before migrating.
    collapsed: true

