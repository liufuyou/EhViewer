# EhViewer 版本清单，全仓库唯一数据源。
# 改完运行 `python scripts/render.py` 生成两份 README。
#
# status 只写 taken_down（下架）或 archived（归档），其他状态按 released 自动算：
#   ≤60 天 活跃 / 60~180 天 更新较少 / >180 天 停更

meta:
  last_checked: 2026-11-05      # 上次人工核对日期，务必和实际核对时间一致
  active_within_days: 60        # 60 天内发过版 = 活跃
  dormant_after_days: 180       # 超过 180 天没发版 = 停更
  checked_line_until: 2027-02-05  # README 顶部「最后核对」行的保留期限；过期后由 maintenance workflow 删掉本字段

