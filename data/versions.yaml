# ============================================================
# EhViewer 版本清单 —— 全仓库唯一数据源
# 改这里，然后运行 `python scripts/render.py` 重新生成中英文 README。
# 不要直接改 README.md / README.en.md，它们会被覆盖。
# ============================================================
#
# status 取值（只写这四种之一）：
#   active      活跃，正常维护
#   stale       仍在，但很久没发版（脚本也会按 stale_after_days 自动判断）
#   taken_down  已下架 / 仓库不可访问（DMCA、删除、私有化）
#   archived    官方或社区已归档，仅存档
#
# 注意：不要写 status，脚本也会自动判断——
#   距今超过 stale_after_days 天没发版，自动降级为 stale。

meta:
  last_checked: 2026-11-05      # 上次人工核对日期，务必和实际核对时间一致
  stale_after_days: 180         # 超过这个天数没发版，自动标记为"滞后"

# 分组顺序即 README 中的展示顺序
groups:
  - id: recommended
    zh: 推荐版本
    en: Recommended
    zh_intro: 优先用这些。出问题时它们通常能及时修复，并且在持续更新。
    en_intro: Start here. These are fixed quickly when something breaks, and keep shipping updates.

  - id: md3
    zh: MD3 衍生版
    en: MD3 derivatives
    zh_intro: 彩 E 风格，界面更接近 Material Design 3。
    en_intro: Colored-E styling, closer to Material Design 3.

  - id: other_platform
    zh: 其他平台
    en: Other platforms
    zh_intro: 非 Android 平台的选择。
    en_intro: Options for non-Android platforms.

  - id: archived
    zh: 已归档 / 已下架
    en: Archived / taken down
    zh_intro: 不要再用这些。部分版本还会导致数据不兼容，迁移前务必备份。
    en_intro: Do not use these. Some may cause data incompatibility — back up before migrating.

variants:
  # ---------- 推荐 ----------
