# ---------- 正文区块 ----------

safety:
  - zh: 只从作者仓库的 Releases 下载，不要用网盘、论坛附件或镜像站。
    en: Download only from the author's Releases page, never from lockers or mirrors.
  - zh: 认准 `github.com/<作者>/<仓库>/releases`，注意大小写和拼写，仿冒仓库很多。
    en: Check the URL reads `github.com/<owner>/<repo>/releases` — lookalike repos are common.
  - zh: 装之前核对**包名和签名**是否和上一版一致，同名不同签名就是重打包。
    en: Verify the **package name and signing key** match the previous build; same name with a different signature means repackaged.

faq:
  - zh_q: 打开后无法翻页 / 缩略图全裂 / 一直转圈？
    en_q: Pagination broken, thumbnails all blank, or endless loading?
    zh_a: 先升级到最新版。还不行就依次看网络线路、应用内「高级设置」里的 host / DoH / SNI，再清缓存。E 站前端一改，所有第三方客户端都会受影响，通常几天内各分支会跟进。
    en_a: Update first. Then check your network route, the host / DoH / SNI options in advanced settings, and clear the cache. Front-end changes on E-Hentai hit every third-party client; forks usually catch up within days.

  - zh_q: 登录失败，或者里站是空白页（Sad Panda）？
    en_q: Login fails, or ExHentai shows a blank page (Sad Panda)?
    zh_a: 里站需要登录态。三种方式：账号密码（部分分支因验证码失效）、Cookie 登录、网页登录。网页登录要过 Cloudflare，一直循环就先更新 WebView，或改用 Cookie。
    en_a: ExHentai needs a signed-in session. Three ways in — username/password (broken on some forks), cookie login, or web login. Web login has to pass Cloudflare; if it keeps looping, update your WebView or use cookies.

  - zh_q: 换了客户端，书签和下载记录没了？
    en_q: Favorites and downloads vanished after switching clients?
    zh_a: 不同分支的数据库不通用。换之前先在旧客户端导出备份；部分分支支持从压缩包或本地目录导入。
    en_a: Databases differ between forks. Export a backup from the old client first; some forks can import from an archive or a local folder.

  - zh_q: 为什么列表里没有 XXX？
    en_q: Why isn't XXX listed?
    zh_a: 通常是已下架、很久没发版，或者没有公开的下载地址。反馈问题时请附上设备型号、系统版本、版本号和复现步骤。
    en_a: Usually because it was taken down, abandoned, or has no public download. When reporting, include device model, OS version, build number and reproduction steps.
